<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITFORM.AI</title>
    <!-- Apply saved theme before paint to avoid a flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem("fitform_theme") || "light";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="home-body">

    <!-- Top corner: logo always visible left, controls right -->
    <header class="home-topbar">
        <div class="logo">
            <span class="logo-mark">F</span>
            <span class="logo-word">FITFORM<span class="brand-dot">.AI</span></span>
        </div>
        <div class="top-controls">
            <div class="lang-toggle">
                <button class="lang-btn active" onclick="setLang('en')" data-i18n="lang_en">English</button>
                <button class="lang-btn" onclick="setLang('es')" data-i18n="lang_es">Spanish</button>
            </div>
            <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Toggle light or dark mode">
                <!-- Sun (shown in light mode) -->
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
                <!-- Moon (shown in dark mode) -->
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="home-main">
        <!-- Big brand hero -->
        <div class="home-hero">
            <div class="hero-mark">F</div>
            <h1 class="hero-title">FITFORM<span class="brand-dot">.AI</span></h1>
            <p class="tagline" data-i18n="tagline">AI-powered exercise form analysis</p>
        </div>

        <!-- Auth card -->
        <div class="home-card">
            {% if error %}
            <div class="msg msg-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="msg msg-success">{{ success }}</div>
            {% endif %}

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab active" onclick="showTab('login')" data-i18n="login">Log In</button>
                <button class="tab" onclick="showTab('signup')" data-i18n="signup">Sign Up</button>
            </div>

            <!-- Login -->
            <form id="login-tab" class="auth-form" action="/login" method="POST">
                <input type="hidden" name="language" id="login-lang" value="en">
                <input type="text" name="username" autocomplete="username" data-i18n-ph="ph_username" placeholder="Username" required />
                <input type="password" name="password" autocomplete="current-password" data-i18n-ph="ph_password" placeholder="Password" required />
                <button type="submit" class="btn-primary" data-i18n="login">Log In</button>
            </form>

            <!-- Signup -->
            <form id="signup-tab" class="auth-form hidden" action="/signup" method="POST">
                <input type="hidden" name="language" id="signup-lang" value="en">
                <input type="text" name="username" autocomplete="username" data-i18n-ph="ph_choose_user" placeholder="Choose a username" required />
                <input type="password" name="password" autocomplete="new-password" data-i18n-ph="ph_choose_pass" placeholder="Choose a password" required />
                <p class="input-hint" data-i18n="pw_hint">At least 8 characters, letters and numbers only.</p>
                <button type="submit" class="btn-primary" data-i18n="create_account">Create Account</button>
            </form>

            <p class="home-footer" data-i18n="footer">Upload a video. Get instant feedback. Improve your form.</p>
        </div>
    </main>

    <script>
        const homeTranslations = {
            en: {
                tagline: "AI-powered exercise form analysis",
                login: "Log In",
                signup: "Sign Up",
                create_account: "Create Account",
                footer: "Upload a video. Get instant feedback. Improve your form.",
                pw_hint: "At least 8 characters, letters and numbers only.",
                lang_en: "English",
                lang_es: "Spanish",
                ph_username: "Username",
                ph_password: "Password",
                ph_choose_user: "Choose a username",
                ph_choose_pass: "Choose a password",
            },
            es: {
                tagline: "Analisis de forma de ejercicio con IA",
                login: "Iniciar Sesion",
                signup: "Registrarse",
                create_account: "Crear Cuenta",
                footer: "Sube un video. Recibe comentarios al instante. Mejora tu forma.",
                pw_hint: "Al menos 8 caracteres, solo letras y numeros.",
                lang_en: "Ingles",
                lang_es: "Espanol",
                ph_username: "Usuario",
                ph_password: "Contrasena",
                ph_choose_user: "Elige un nombre de usuario",
                ph_choose_pass: "Elige una contrasena",
            }
        };

        function setLang(lang) {
            localStorage.setItem("fitform_lang", lang);

            document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
            const activeBtn = document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`);
            if (activeBtn) activeBtn.classList.add("active");

            const t = homeTranslations[lang];
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll("[data-i18n-ph]").forEach(el => {
                const key = el.getAttribute("data-i18n-ph");
                if (t[key]) el.placeholder = t[key];
            });

            // Send the chosen language with the auth forms
            const ll = document.getElementById("login-lang");
            const sl = document.getElementById("signup-lang");
            if (ll) ll.value = lang;
            if (sl) sl.value = lang;
        }

        function showTab(tab) {
            document.getElementById("login-tab").classList.toggle("hidden", tab !== "login");
            document.getElementById("signup-tab").classList.toggle("hidden", tab !== "signup");
            document.querySelectorAll(".auth-tabs .tab").forEach(b => b.classList.remove("active"));
            event.target.classList.add("active");
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("fitform_theme", theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme") || "light";
            applyTheme(current === "light" ? "dark" : "light");
        }

        // "Pop" effect on interactive elements
        document.addEventListener("click", (e) => {
            const el = e.target.closest(".btn-primary, .tab, .lang-btn, .icon-btn");
            if (!el) return;
            el.classList.remove("is-popping");
            void el.offsetWidth;  // restart animation
            el.classList.add("is-popping");
        });

        // Load saved language on startup
        setLang(localStorage.getItem("fitform_lang") || "en");
    </script>
</body>
</html>
